<header class="header">
    <svg class="ink-blot" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <filter id="ink-spread" x="-20%" y="-20%" width="140%" height="140%">
                <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" result="noise"/>
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="15" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
                <feGaussianBlur in="displaced" stdDeviation="2.5" result="blurred"/>
                <feComponentTransfer in="blurred" result="contrasted">
                    <feFuncA type="linear" slope="2.5" intercept="-0.5"/>
                </feComponentTransfer>
                <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="capillary"/>
                <feComponentTransfer in="capillary" result="capillary-fade">
                    <feFuncA type="linear" slope="0.2"/>
                </feComponentTransfer>
                <feMerge>
                    <feMergeNode in="capillary-fade"/>
                    <feMergeNode in="contrasted"/>
                </feMerge>
            </filter>
            <radialGradient id="ink-grad" cx="40%" cy="40%" r="65%">
                <stop offset="0%" stop-color="#543825"/>
                <stop offset="60%" stop-color="#3b2313"/>
                <stop offset="100%" stop-color="#69462a" stop-opacity="0.6"/>
            </radialGradient>
        </defs>
        <circle cx="45" cy="40" r="18" fill="url(#ink-grad)" filter="url(#ink-spread)"/>
        <circle cx="20" cy="25" r="3" fill="#3b2313" filter="url(#ink-spread)"/>
        <circle cx="75" cy="50" r="2.5" fill="#543825" filter="url(#ink-spread)"/>
        <circle cx="65" cy="15" r="1.5" fill="#3b2313" filter="url(#ink-spread)"/>
        <path d="M48,55 Q52,70 55,80 Q56,83 53,84 Q50,85 49,80 Q45,68 48,55" fill="url(#ink-grad)" filter="url(#ink-spread)"/>
    </svg>
    {{ $home := site.GetPage "/" }}
    <h1 class="name">{{ default site.Title .Title }}</h1>
    <div class="subtitle">
        {{- if .IsHome -}}
            {{ $home.Params.role }}
        {{- else if .IsSection -}}
            {{- if .Content -}}
                {{ .Content }}
            {{- else -}}
                {{ default $home.Params.role .Description }}
            {{- end -}}
        {{- else -}}
            {{ .Description }}
        {{- end -}}
    </div>
</header>
