<!-- Coffee Stain & Effects SVG -->
<svg class="coffee-stain" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Mask 1: Large abstract breaks and holes in the stain -->
        <filter id="noise-mask-1">
            <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" result="cloud"/>
            <!-- Convert the noise into high-contrast black & white patches -->
            <feColorMatrix type="matrix" in="cloud" values="
                7 0 0 0 -2.5
                7 0 0 0 -2.5
                7 0 0 0 -2.5
                0 0 0 0 1" />
        </filter>
        <mask id="stain-mask-1">
            <rect width="100%" height="100%" fill="white" filter="url(#noise-mask-1)"/>
        </mask>

        <!-- Mask 2: Different noise pattern for the inner ring so it breaks differently -->
        <filter id="noise-mask-2">
            <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4" result="cloud"/>
            <feColorMatrix type="matrix" in="cloud" values="
                5 0 0 0 -1.5
                5 0 0 0 -1.5
                5 0 0 0 -1.5
                0 0 0 0 1" />
        </filter>
        <mask id="stain-mask-2">
            <rect width="100%" height="100%" fill="white" filter="url(#noise-mask-2)"/>
        </mask>

        <!-- Liquid edge distortion + Capillary bleed (applied over the patchy mask) -->
        <filter id="liquid-warp" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" result="warp-noise"/>
            <feDisplacementMap in="SourceGraphic" in2="warp-noise" scale="12" xChannelSelector="R" yChannelSelector="G" result="warped"/>
            <feGaussianBlur in="warped" stdDeviation="1.5" result="blurred"/>
            <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="bleed"/>
            <feComponentTransfer in="bleed" result="bleed-faded">
                <feFuncA type="linear" slope="0.3"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode in="bleed-faded"/>
                <feMergeNode in="blurred"/>
            </feMerge>
        </filter>

        <!-- Faint brown gradient -->
        <radialGradient id="coffee-grad" cx="45%" cy="45%" r="60%">
            <stop offset="60%" stop-color="#7a4b27" stop-opacity="0.05"/>
            <stop offset="85%" stop-color="#5a3214" stop-opacity="0.1"/>
            <stop offset="95%" stop-color="#4a240c" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#2a1103" stop-opacity="0"/>
        </radialGradient>
    </defs>
    
    <g filter="url(#liquid-warp)">
        <!-- Layer 1: The main broken pool of coffee -->
        <g mask="url(#stain-mask-1)">
            <!-- Faint center pool (perfect circle, broken by mask) -->
            <circle cx="100" cy="100" r="70" fill="url(#coffee-grad)"/>
            <circle cx="150" cy="160" r="30" fill="url(#coffee-grad)"/>
            <circle cx="40" cy="50" r="40" fill="url(#coffee-grad)"/>
            <!-- Wide abstract swoosh -->
            <path d="M 20 80 Q 70 200 160 140" fill="none" stroke="url(#coffee-grad)" stroke-width="20"/>
        </g>
        
        <!-- Layer 2: The darker, crusty rings from the bottom of the glass -->
        <g mask="url(#stain-mask-2)">
            <!-- Perfect circle cup rings, but the mask makes parts of the line fade out and disappear -->
            <circle cx="100" cy="100" r="70" fill="none" stroke="#4a240c" stroke-width="5" stroke-opacity="0.3"/>
            <!-- Second slightly shifted cup ring -->
            <circle cx="103" cy="97" r="70" fill="none" stroke="#5a3214" stroke-width="3" stroke-opacity="0.2"/>
            
            <!-- Intense little droplets -->
            <circle cx="70" cy="170" r="6" fill="#3d1d07" opacity="0.3"/>
            <circle cx="160" cy="60" r="10" fill="#4a240c" opacity="0.2"/>
            <circle cx="30" cy="90" r="4" fill="#2a1103" opacity="0.3"/>
            
            <!-- Little droplets scattered outside the ring -->
            <circle cx="185" cy="90" r="3" fill="#3d1d07" opacity="0.4"/>
            <circle cx="20" cy="120" r="2" fill="#4a240c" opacity="0.3"/>
            <circle cx="85" cy="25" r="1.5" fill="#2a1103" opacity="0.5"/>
        </g>
    </g>
</svg>
