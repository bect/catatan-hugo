<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default `en` }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
    <main class="paper">
        {{ if not .IsHome }}
        <a href="{{ site.Home.RelPermalink }}" class="home-btn" aria-label="Return Home" title="Return Home">
            <svg class="home-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 10 L12 3 L20 10 L20 21 L4 21 Z"></path>
            </svg>
        </a>
        {{ end }}
        <div class="foxing"></div>
        
        <div class="top-search-container">
            <form action="/search/" method="get" class="top-search-form">
                <input type="search" name="q" class="top-search-input" placeholder="Search archives..." aria-label="Search">
                <button type="button" class="top-search-toggle" aria-label="Toggle Search" onclick="this.parentElement.classList.toggle('expanded'); this.previousElementSibling.focus();">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </form>
        </div>
        
        {{ partial "svg-effects.html" . }}
        
        <div class="layout">
            <div class="content">
                {{ partial "header.html" . }}
                {{ block "main" . }}{{ end }}
            </div>
            
            {{ partial "sidebar.html" . }}
        </div>
    </main>
</body>
</html>
